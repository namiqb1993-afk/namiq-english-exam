<!doctype html><html lang="az"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Müəllim paneli</title><style>body{font:16px system-ui;background:#f4f9ff;color:#163650;max-width:1050px;margin:auto;padding:25px}article{background:white;border:1px solid #dae7f4;border-radius:15px;padding:24px;margin:16px 0}input{padding:12px;border:1px solid #bccbd9;border-radius:8px}button,a.btn{background:#1668c6;color:white;padding:11px 18px;border:0;border-radius:8px;cursor:pointer;display:inline-block;text-decoration:none}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dce6f2;padding:10px;text-align:left}section{overflow:auto}.muted{color:#62798e}</style><header><h1>Namiq Bağırlı — Müəllim paneli</h1><p>Əlaqə: 050 609 70 97 · <a href="/">Şagird səhifəsi</a></p></header><article id="login"><h2>Müəllim girişi</h2><input type="password" id="password" placeholder="Müəllim şifrəsi"><button onclick="login()">Daxil ol</button><p id="message"></p></article><article id="dashboard" hidden><h2>Şagird nəticələri</h2><p><a class="btn" href="/api/admin/export.csv">CSV yüklə</a> <button onclick="load()">Yenilə</button> <button onclick="logout()">Çıxış</button></p><section><table><thead><tr><th>Şagird</th><th>Tarix</th><th>Obyektiv</th><th>Esse</th><th>E-mail</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></article><article id="details" hidden></article><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));async function call(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'Xəta');return d;}async function login(){try{await call('/api/login','POST',{password:$('password').value});$('login').hidden=true;$('dashboard').hidden=false;load()}catch(e){$('message').textContent=e.message}}
async function load(){try{let a=await call('/api/admin/submissions');$('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.first_name+' '+x.last_name)}</td><td>${esc(x.submitted_at)}</td><td>${x.score_objective}/80</td><td>${x.essay_approved?x.essay_score+'/20':'Gözləyir'}</td><td>${esc(x.email_status)}</td><td><button onclick="inspect('${x.id}')">Bax</button></td></tr>`).join('')}catch(e){alert(e.message)}}
async function inspect(id){try{let d=await call('/api/admin/attempt/'+id),x=d.row;$('details').hidden=false;$('details').innerHTML=`<h2>${esc(x.first_name+' '+x.last_name)}</h2><p>İmtahan: ${esc(id)} · ${esc(x.submitted_at)}</p><h3>Qrammatika, dinləmə və oxu</h3>${d.details.map(a=>`<p><b>${a.number}. ${esc(d.exam.questions[a.number-1].q)}</b><br>Şagird: ${esc(JSON.stringify(a.answer))} · Düzgün: ${esc(JSON.stringify(a.correct_answer))} · Bal ${a.raw}</p>`).join('')}<h3>26. Esse</h3><p style="white-space:pre-wrap">${esc(d.answers[25])}</p><p class="muted">Qrammatika (5), cümlə quruluşu (5), söz ehtiyatı (4), mövzuya uyğunluq (3), təşkil və həcm (3)</p><div id="rubrics">${[5,5,4,3,3].map((v,i)=>`<label>${['Qrammatika','Cümlə quruluşu','Lüğət','Mövzu','Təşkil'][i]} /${v}: <input type="number" min="0" max="${v}" step="0.5" value="0" id="r${i}"></label><br>`).join('')}</div><button onclick="approve('${id}')">Esseni qiymətləndir və təsdiqlə</button>`;$('details').scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}}
async function approve(id){try{let rubric=[0,1,2,3,4].map(i=>Number($('r'+i).value));let d=await call('/api/admin/approve/'+id,'POST',{rubric});alert('Yekun bal: '+d.final+'/100');load();$('details').hidden=true}catch(e){alert(e.message)}}async function logout(){await call('/api/logout','POST');location.reload()}call('/api/admin/submissions').then(()=>{$('login').hidden=true;$('dashboard').hidden=false;load()}).catch(()=>{});
</script></html>
